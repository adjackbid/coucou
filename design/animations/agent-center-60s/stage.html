<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Agent Center · 60 秒</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1920px;height:1080px}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Everything is a function of time: draw(t) always gives the same picture for
// the same t. render.js steps t frame by frame; opened in a browser it plays.
const W = 1920, H = 1080, c = document.getElementById('c'), ctx = c.getContext('2d');
const C = { bg: '#0b0c0e', panel: '#15171b', panel2: '#1c1f25', line: '#2a2e36', text: '#eceef2', dim: '#9aa1ad', blue: '#5b8cff', green: '#3ccf91', violet: '#a77bff', amber: '#f2b33d', red: '#ff6b6b', white: '#ffffff' };
const F = '"Microsoft JhengHei UI","Microsoft JhengHei","Segoe UI",sans-serif', M = '"Cascadia Mono","Consolas",monospace';

// ── images (the report's screenshots) ────────────────────────────────────────
const IMGS = {}, NAMES = ['waiting', 'office', 'links', 'secretary-status', 'cost'];
let loaded = 0;
window.ready = false;
NAMES.forEach((n) => { const i = new Image(); i.onload = i.onerror = () => { if (++loaded === NAMES.length) window.ready = true; }; i.src = '../../../docs/team-report/img/' + n + '.png'; IMGS[n] = i; });

// ── maths ────────────────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeIn = (x) => x * x * x;
const easeInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const inout = (t, a, b, fi = .3, fo = .3) => (t < a || t > b ? 0 : Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b)));
const rnd = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const hexa = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const mix = (h1, h2, x) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const ch = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, x)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };
const bez = (p0, p1, p2, u) => { const a = lerp(p0[0], p1[0], u), b = lerp(p1[0], p2[0], u), c2 = lerp(p0[1], p1[1], u), d = lerp(p1[1], p2[1], u); return [lerp(a, b, u), lerp(c2, d, u)]; };

// ── drawing ──────────────────────────────────────────────────────────────────
let SA = 1; // the scene's own alpha; ga() multiplies element alpha into it
const ga = (x) => { ctx.globalAlpha = SA * clamp(x); };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, r = 24, fill = 'rgba(21,23,27,.94)', stroke = 'rgba(255,255,255,.09)', lw = 2) { rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
function txt(s, x, y, size = 32, color = C.text, weight = 600, align = 'center', font = F, base = 'middle', ls = 0) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = ls ? ls + 'em' : '0px'; ctx.fillText(s, x, y); ctx.letterSpacing = '0px';
}
function chip(x, y, label, color, size = 24, o = {}) {
  ctx.font = `${o.weight || 600} ${size}px ${o.font || F}`; const pad = o.pad ?? size * .8; const w = ctx.measureText(label).width + pad * 2, h = o.h ?? size * 1.75;
  const x0 = o.align === 'left' ? x : x - w / 2; rr(x0, y - h / 2, w, h, h / 2); ctx.fillStyle = o.fill ?? hexa(color, .16); ctx.fill();
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = 2; ctx.stroke(); }
  txt(label, x0 + w / 2, y + 1, size, o.color ?? color, o.weight || 600, 'center', o.font || F); return w;
}
function glow(x, y, r, color) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function line(x1, y1, x2, y2, color, w = 3, p = 1, dash = null, off = 0) {
  if (p <= 0) return; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + (x2 - x1) * p, y1 + (y2 - y1) * p); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.lineDashOffset = off; ctx.stroke(); ctx.setLineDash([]);
}
function head(x, y, ang, color, s = 14) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s, -s * .55); ctx.lineTo(-s, s * .55); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore(); }
function ring(x, y, r, color, w = 3) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke(); }
function pulse(x, y, t, t0, color, period = 1.2, rmax = 160, r0 = 20) { if (t < t0) return; const ph = ((t - t0) % period) / period; ga((1 - ph) * .6); ring(x, y, r0 + rmax * ph, color, 3); ga(1); }
function mochi(x, y, s, color, t, seed = 0, o = {}) {
  const w = s, h = s * .82; rr(x - w / 2, y - h / 2, w, h, s * .42); ctx.fillStyle = color; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.16)'; rr(x - w / 2 + s * .1, y - h / 2 + s * .07, w * .5, h * .2, s * .1); ctx.fill();
  const bp = (t * 1 + seed * .77) % 3.3, blink = bp < .14 ? 1 - Math.abs(bp / .07 - 1) : 0;
  const eh = Math.max(2, s * .2 * (1 - .92 * blink)), ew = s * .11;
  ctx.fillStyle = '#101216';
  if (o.mood === 'x') { ctx.strokeStyle = '#101216'; ctx.lineWidth = s * .06; for (const ex of [-s * .17, s * .17]) { ctx.beginPath(); ctx.moveTo(x + ex - s * .07, y - s * .07); ctx.lineTo(x + ex + s * .07, y + s * .07); ctx.moveTo(x + ex + s * .07, y - s * .07); ctx.lineTo(x + ex - s * .07, y + s * .07); ctx.stroke(); } }
  else for (const ex of [-s * .17, s * .17]) { rr(x + ex - ew / 2, y - eh / 2, ew, eh, ew / 2); ctx.fill(); }
  if (o.crown) { ctx.fillStyle = C.amber; const cx = x, cy = y - h / 2 - s * .04; ctx.beginPath(); ctx.moveTo(cx - s * .2, cy); ctx.lineTo(cx - s * .25, cy - s * .2); ctx.lineTo(cx - s * .09, cy - s * .1); ctx.lineTo(cx, cy - s * .26); ctx.lineTo(cx + s * .09, cy - s * .1); ctx.lineTo(cx + s * .25, cy - s * .2); ctx.lineTo(cx + s * .2, cy); ctx.closePath(); ctx.fill(); }
}
function cursor(x, y) { ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.lineTo(8, 23); ctx.lineTo(14, 36); ctx.lineTo(20, 33); ctx.lineTo(14, 21); ctx.lineTo(24, 20); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); }
function docIcon(x, y, kind, color) { rr(x - 20, y - 26, 40, 52, 6); ctx.fillStyle = hexa(color, .2); ctx.fill(); ctx.strokeStyle = hexa(color, .8); ctx.lineWidth = 2; ctx.stroke(); if (kind === 'image') { ctx.fillStyle = hexa(color, .9); ctx.beginPath(); ctx.moveTo(x - 12, y + 14); ctx.lineTo(x - 2, y - 2); ctx.lineTo(x + 5, y + 6); ctx.lineTo(x + 9, y + 1); ctx.lineTo(x + 14, y + 14); ctx.closePath(); ctx.fill(); } else { ctx.fillStyle = hexa(color, .8); for (let k = 0; k < 3; k++) ctx.fillRect(x - 11, y - 10 + k * 9, k === 2 ? 14 : 22, 3); } }
function shield(x, y, s, color) { ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * .85, y - s * .65); ctx.lineTo(x + s * .75, y + s * .25); ctx.quadraticCurveTo(x + s * .4, y + s * .9, x, y + s); ctx.quadraticCurveTo(x - s * .4, y + s * .9, x - s * .75, y + s * .25); ctx.lineTo(x - s * .85, y - s * .65); ctx.closePath(); ctx.fillStyle = hexa(color, .22); ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.stroke(); }
function term(x, y, w, h, title, lines, color, t) {
  panel(x - w / 2, y - h / 2, w, h, 16, 'rgba(14,15,18,.96)', 'rgba(255,255,255,.1)');
  ctx.fillStyle = 'rgba(255,255,255,.05)'; rr(x - w / 2, y - h / 2, w, 38, [16, 16, 0, 0]); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x - w / 2 + 22, y - h / 2 + 19, 6, 0, 7); ctx.fill();
  txt(title, x - w / 2 + 40, y - h / 2 + 19, 18, C.dim, 600, 'left', M);
  lines.forEach((l, i) => txt(l, x - w / 2 + 22, y - h / 2 + 72 + i * 34, 20, i ? C.dim : C.text, 500, 'left', M));
  if (Math.floor(t * 2) % 2 === 0) { ctx.fillStyle = color; ctx.fillRect(x - w / 2 + 22, y - h / 2 + 72 + lines.length * 34 - 10, 12, 22); }
}
function bar(x, y, w, h, p, color, bgc = 'rgba(255,255,255,.08)') { rr(x, y, w, h, h / 2); ctx.fillStyle = bgc; ctx.fill(); if (p > 0) { rr(x, y, Math.max(h, w * clamp(p)), h, h / 2); ctx.fillStyle = color; ctx.fill(); } }

// A scene: enters with a fade and a little scale, leaves with a fade.
function frame(t, a, b, o = {}) {
  if (t < a || t >= b) return false;
  const fi = o.fi ?? .45, fo = o.fo ?? .4, ai = seg(t, a, a + fi), ao = 1 - seg(t, b - fo, b);
  SA = Math.min(easeOut(ai), ao);
  const sin = o.sin ? lerp(o.sin[0], o.sin[1], easeOut(ai)) : lerp(.94, 1, easeOut(ai));
  const sout = o.exit === 'collapse' ? lerp(1, .15, easeIn(1 - ao)) : lerp(1, 1.05, easeIn(1 - ao));
  ctx.globalAlpha = SA; ctx.translate(W / 2, H / 2); ctx.scale(sin * sout, sin * sout); ctx.translate(-W / 2, -H / 2);
  return true;
}

// ── background ───────────────────────────────────────────────────────────────
function bg(t, bright = 1) {
  ctx.globalAlpha = 1; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = bright;
  glow(320 + Math.sin(t * .3) * 80, 220, 760, 'rgba(91,140,255,.17)');
  glow(1620 + Math.cos(t * .25) * 80, 320, 640, 'rgba(167,123,255,.13)');
  glow(1000 + Math.sin(t * .2) * 100, 1040, 640, 'rgba(60,207,145,.09)');
  ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,.035)';
  for (let x = 60; x < W; x += 60) for (let y = 60; y < H; y += 60) ctx.fillRect(x, y, 2, 2);
}

// ── subtitles (burned in) ────────────────────────────────────────────────────
const SUBS = [
  [0.5, 3.6, '一個人對一個 AI 的時代,該升級了。'],
  [4.2, 7.0, '同時開好幾個終端機,自己當中繼站傳話,'],
  [7.0, 9.6, '你,成了整條工作流的人類瓶頸。'],
  [10.2, 13.6, 'Agent Center 當編排中樞,Meta Agent 帶隊,Member Agent 各司其職。'],
  [13.7, 16.8, 'Claude Code、Codex、Copilot、Antigravity 混編,各用所長。'],
  [17.2, 20.6, 'Meta Agent 拆任務,只寫完成條件,不逐行指揮。'],
  [20.7, 24.6, '沒有相依的任務同時推進,前端不用等後端。'],
  [25.2, 29.3, '自主協作:一般動作直接放行,危險動作跳核准卡。'],
  [29.6, 31.8, '憲法禁止的,直接擋下,不打擾你。'],
  [32.2, 35.2, '文件放一次,依可見性分給 Meta Agent 或全隊,'],
  [35.3, 37.8, '機密只到 Meta Agent,金鑰自動攔下。'],
  [38.2, 41.6, '成員交付,Meta Agent 逐條核對完成條件,驗收或退回。'],
  [41.7, 44.8, '全部驗收,團隊完成,交付物都在工作資料夾。'],
  [45.2, 48.6, '即時畫面、協作地圖、溝通紀錄,一個視窗看完全隊。'],
  [48.7, 51.8, '秘書一句話查現況,成本頁守住 Token 預算。'],
  [52.2, 56.6, '從會議紀錄功能到專案管理平台,描述目標,團隊就動起來。'],
  [57.7, 59.4, 'Agent Center:描述目標,授權代理,驗收成果。'],
];
function subs(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const [a, b, s] of SUBS) {
    const al = inout(t, a, b, .18, .18); if (al <= 0) continue;
    ctx.globalAlpha = al; ctx.font = `600 38px ${F}`; const w = ctx.measureText(s).width + 56; const y = 992 + (1 - easeOut(seg(t, a, a + .18))) * 14;
    rr(960 - w / 2, y - 34, w, 68, 34); ctx.fillStyle = 'rgba(0,0,0,.62)'; ctx.fill();
    txt(s, 960, y + 1, 38, '#fff', 600);
  }
  ctx.globalAlpha = 1;
}

// ── scene 0 · title (0–4) ────────────────────────────────────────────────────
function s0(t) {
  if (!frame(t, 0, 4, { fi: .25, fo: .4 })) return;
  const pk = seg(t, 2.3, 2.7); ga(pk); txt('多代理編排 · AGENT ORCHESTRATION', 960, 250 + (1 - easeOut(pk)) * 20, 26, C.blue, 700, 'center', F, 'middle', .18);
  const cols = [C.blue, C.green, C.violet, C.amber];
  for (let i = 0; i < 4; i++) { const t0 = .3 + i * .15, p = seg(t, t0, t0 + .5); if (p <= 0) continue; ga(Math.min(1, p * 3)); ctx.save(); ctx.translate(960 + (i - 1.5) * 130, 400); const s = back(p); ctx.scale(s, s); mochi(0, 0, 96, cols[i], t, i); ctx.restore(); }
  const p1 = seg(t, 1.2, 1.7); ga(p1); txt('Agent Center', 960, 560 + (1 - easeOut(p1)) * 40, 128, C.text, 800);
  const p2 = seg(t, 1.8, 2.3); ga(p2); txt('在桌面上編排你的 AI 夢幻團隊', 960, 680 + (1 - easeOut(p2)) * 30, 46, C.dim, 500);
}

// ── scene 1 · the human bottleneck (4–10) ───────────────────────────────────
function s1(t) {
  if (!frame(t, 4, 10, { fi: .4, fo: .55, exit: 'collapse' })) return;
  const HX = 960, HY = 560;
  const T = [
    { x: 400, y: 265, n: 'claude', col: C.amber, lines: ['> claude', 'Reading src/meetings…', '✎ Edit EditorPage.tsx'] },
    { x: 1520, y: 265, n: 'codex app-server', col: C.green, lines: ['> codex', 'npm test -- meetings', 'PASS 12 · FAIL 0'] },
    { x: 400, y: 835, n: 'copilot --acp', col: C.blue, lines: ['> copilot', 'waiting for your input…'] },
    { x: 1520, y: 835, n: 'agy -p', col: C.violet, lines: ['> agy', 'generating layout…'] },
  ];
  T.forEach((w, i) => { const p = seg(t, 4.1 + i * .15, 4.5 + i * .15); if (p <= 0) return; ga(p); ctx.save(); ctx.translate(w.x, w.y); const s = lerp(.6, 1, back(p)); ctx.scale(s, s); term(0, 0, 440, 210, w.n, w.lines, w.col, t); ctx.restore(); });
  const pl = seg(t, 4.4, 4.8); ga(pl); chip(960, 150, '結對程式設計 Peer Programming · 單線程 Single-threaded', C.dim, 26, { fill: 'rgba(255,255,255,.06)' });
  const pa = seg(t, 4.9, 5.4), labels = ['Context', '複製貼上', '等它跑完…', '再問一次'];
  T.forEach((w, i) => {
    const dx = HX - w.x, dy = HY - w.y, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
    const x1 = w.x + ux * 250, y1 = w.y + uy * 135, x2 = HX - ux * 130, y2 = HY - uy * 130;
    ga(pa * .8); line(x1, y1, x2, y2, 'rgba(255,255,255,.28)', 3, pa, [14, 12], -t * 140 * (i % 2 ? -1 : 1));
    if (pa >= 1) { const q = (t * .45 + i * .27) % 1, u = i % 2 ? q : 1 - q; ga(1); chip(lerp(x1, x2, u), lerp(y1, y2, u), labels[i], i % 2 ? C.amber : C.blue, 22, { fill: 'rgba(21,23,27,.95)', stroke: hexa(i % 2 ? C.amber : C.blue, .6) }); }
  });
  const ph = seg(t, 4.3, 4.7), red = seg(t, 6.4, 7.0); ga(ph);
  ctx.fillStyle = mix('#d7dbe3', C.red, red * .9); ctx.beginPath(); ctx.arc(HX, 500, 46, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(HX, 652, 88, Math.PI, 0); ctx.fill();
  txt('你', HX, 700, 34, C.text, 700);
  pulse(HX, 560, t, 6.3, hexa(C.red, .9), 1.0, 240, 60);
  const ps = seg(t, 7.0, 7.3);
  if (ps > 0) { ga(Math.min(1, ps * 2)); ctx.save(); ctx.translate(960, 560); ctx.rotate(-.12); const s = lerp(2.4, 1, easeOut(ps)); ctx.scale(s, s); rr(-340, -112, 680, 224, 18); ctx.fillStyle = 'rgba(255,107,107,.14)'; ctx.fill(); ctx.strokeStyle = C.red; ctx.lineWidth = 8; ctx.stroke(); txt('人類瓶頸', 0, -18, 120, C.red, 900); txt('HUMAN BOTTLENECK', 0, 74, 30, C.red, 700, 'center', F, 'middle', .22); ctx.restore(); }
}

// ── scene 2 · the hub (10–17) ───────────────────────────────────────────────
const MEM2 = [
  { x: 380, y: 540, n: 'Planner', zh: '規劃', base: 'Claude Code', model: 'opus', col: C.violet },
  { x: 640, y: 820, n: 'Coder', zh: '後端', base: 'Codex', model: 'gpt-5.6', col: C.green },
  { x: 1280, y: 820, n: 'Designer', zh: '前端', base: 'Antigravity', model: 'gemini-3.8', col: C.amber },
  { x: 1540, y: 540, n: 'Tester', zh: '測試', base: 'Copilot CLI', model: 'glm-5.3', col: C.red },
];
function s2(t) {
  if (!frame(t, 10, 17, { fi: .5, fo: .45, sin: [.15, 1] })) return;
  const hx = 960, hy = 540;
  const pa = seg(t, 12.0, 12.4); ga(pa); chip(330, 150, '星狀架構 Hub-and-Spoke', C.dim, 24, { fill: 'rgba(255,255,255,.06)' });
  const pb = seg(t, 13.8, 14.2); ga(pb); chip(1560, 150, '認知模型適配 · 各用所長', C.amber, 24);
  // Meta Agent
  const mx = 960, my = 215, pm = seg(t, 10.6, 11.1);
  if (pm > 0) { const pl = seg(t, 10.9, 11.3); ga(pl * .9); line(hx, hy - 70, mx, my + 70, hexa(C.blue, .7), 4, pl); ga(pm); ctx.save(); ctx.translate(mx, my); const s = back(pm); ctx.scale(s, s); mochi(0, -12, 110, C.blue, t, 9, { crown: true }); txt('Meta Agent', 0, 78, 34, C.text, 800); txt('主控協調者 · Orchestrator', 0, 114, 22, C.dim, 500); ctx.restore(); }
  // members
  MEM2.forEach((m, i) => {
    const t0 = 11.5 + i * .45, p = seg(t, t0, t0 + .5); if (p <= 0) return;
    const pl = seg(t, t0 + .2, t0 + .6), dx = m.x - hx, dy = m.y - hy, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
    const x1 = hx + ux * 200, y1 = hy + uy * 85, x2 = m.x - ux * 95, y2 = m.y - uy * 95;
    ga(pl * .8); line(x1, y1, x2, y2, 'rgba(255,255,255,.28)', 3, pl);
    if (t > t0 + .7) for (let k = 0; k < 2; k++) { const q = (t * .5 + k * .5 + i * .13) % 1, u = k ? 1 - q : q; ga(1); ctx.fillStyle = k ? m.col : C.blue; ctx.beginPath(); ctx.arc(lerp(x1, x2, u), lerp(y1, y2, u), 5, 0, 7); ctx.fill(); }
    ga(p); ctx.save(); ctx.translate(m.x, m.y); const s = back(p); ctx.scale(s, s);
    txt('Member Agent', 0, -82, 18, C.dim, 600, 'center', F, 'middle', .08); mochi(0, -16, 86, m.col, t, i + 1); txt(m.n + ' · ' + m.zh, 0, 54, 28, C.text, 800);
    const pc = seg(t, 14.0 + i * .2, 14.3 + i * .2); ctx.save(); ctx.translate(0, 96); const sc = pc > 0 ? lerp(1, 1.12, Math.sin(pc * Math.PI)) : 1; ctx.scale(sc, sc); chip(0, 0, pc > 0 ? m.base + ' · ' + m.model : m.base, m.col, 20); ctx.restore();
    ctx.restore();
  });
  // hub
  const ph = seg(t, 10, 10.5); ga(ph); ctx.save(); ctx.translate(hx, hy); const s = back(ph); ctx.scale(s, s); panel(-200, -70, 400, 140, 34, 'rgba(26,36,64,.97)', hexa(C.blue, .7), 3); txt('Agent Center', 0, -14, 52, C.text, 800); txt('編排中樞 · Orchestration Hub', 0, 38, 22, C.dim, 500); ctx.restore();

  { title: '案例一 · 線上會議紀錄功能', col: C.blue, t0: 52.2, team: [['Meta Agent', 'Claude Code', C.blue], ['Tester', 'Claude Code', C.green], ['Designer', 'Antigravity', C.violet], ['Coder', 'Codex', C.amber]], tasks: ['需求拆解', '會議列表頁', '會議 API 與資料表', '編輯器頁面', '需求確認', '整合測試', '驗收報告'] },
  { title: '案例二 · 專案管理平台', col: C.green, t0: 52.5, team: [['Meta Agent', 'Claude Code', C.blue], ['Tester', 'Claude Code', C.green], ['Designer', 'Antigravity', C.violet], ['Coder', 'Codex', C.amber]], tasks: ['執行藍圖', '看板設計稿', '專案與任務 API', '看板拖拉頁', '需求確認', '整合測試', '驗收報告'] },
];
function s8(t) {
  if (!frame(t, 52, 57, { fi: .3, fo: .4, exit: 'collapse' })) return;
  const rise = seg(t, 55.3, 56.6);
  if (rise > 0) { ga(rise * .9); for (let k = 0; k < 70; k++) { const a = rnd(k + 300) * Math.PI * 2, r0 = 1200, sp = 600 + rnd(k + 400) * 900, d = (r0 - ((t - 55.3) * sp + rnd(k + 500) * r0) % r0); ctx.strokeStyle = hexa([C.blue, C.violet, C.green][k % 3], .6); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(960 + Math.cos(a) * d, 540 + Math.sin(a) * d * .6); ctx.lineTo(960 + Math.cos(a) * (d + 90 * rise), 540 + Math.sin(a) * (d + 90 * rise) * .6); ctx.stroke(); } }
  CASES.forEach((k, ci) => {
    const p = seg(t, k.t0, k.t0 + .5); if (p <= 0) return; const x = 180 + ci * 810, y = lerp(1180, 230, back(p)), w = 750, h = 640;
    ga(1); ctx.save(); ctx.translate(x + w / 2, y + h / 2); const s = lerp(1, 1.06, rise); ctx.scale(s, s); ctx.translate(-(x + w / 2), -(y + h / 2));
    panel(x, y, w, h, 28, 'rgba(21,23,27,.96)', hexa(k.col, .45), 2); txt(k.title, x + 32, y + 48, 32, C.text, 800, 'left');
    k.team.forEach(([role, base, col], i) => { const mx = x + 110 + i * 178, my = y + 150; mochi(mx, my, 60, col, t, i + ci * 4 + 20, { crown: i === 0 }); txt(role, mx, my + 54, 19, C.text, 700); txt(base, mx, my + 78, 16, C.dim, 500); });
    k.tasks.forEach((task, i) => { const tl = 53.0 + ci * .3 + i * .22, lit = seg(t, tl, tl + .2); const col = i % 2, row = Math.floor(i / 2); const px = x + 32 + col * 350, py = y + 290 + row * 58; rr(px, py, 330, 46, 23); ctx.fillStyle = lit > 0 ? hexa(C.green, .18 + .1 * lit) : 'rgba(255,255,255,.06)'; ctx.fill(); if (lit > 0) { ctx.strokeStyle = hexa(C.green, .6); ctx.lineWidth = 2; ctx.stroke(); } txt(`TASK-0${i + 1} ${task}`, px + 18, py + 24, 19, lit > 0 ? C.text : C.dim, 600, 'left'); if (lit > 0) txt('✓', px + 304, py + 24, 22, C.green, 900); });
    const n = k.tasks.filter((_, i) => t >= 53.0 + ci * .3 + i * .22).length; bar(x + 32, y + 548, 560, 14, n / 7, C.green); txt(`${n}/7 已驗收`, x + w - 32, y + 555, 20, n === 7 ? C.green : C.dim, 700, 'right');
    const pf = seg(t, 55.0 + ci * .2, 55.25 + ci * .2); if (pf > 0) { ctx.save(); ctx.translate(x + w - 150, y + 48); ctx.scale(back(pf), back(pf)); chip(0, 0, '✓ 團隊完成', C.green, 20); ctx.restore(); }
    ctx.restore();
  });
}

// ── scene 9 · the title again (57–60) ───────────────────────────────────────
function s9(t) {
  if (t < 56.98 || t >= 60) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < 57.3) return;
  SA = 1; const ph = seg(t, 57.3, 57.6), sh = (1 - ph) * 14;
  ctx.translate(960 + Math.sin(t * 97) * sh, 540 + Math.cos(t * 83) * sh); const s = lerp(1.35, 1, easeOut(ph)); ctx.scale(s, s); ctx.translate(-960, -540);
  glow(960, 540, 900, hexa(C.blue, .22 * (1 - ph) + .1));
  ga((1 - ph) * .8); ring(960, 540, 60 + ph * 1000, 'rgba(255,255,255,.9)', 18 * (1 - ph) + 1); ga(.55 * Math.pow(1 - ph, 2.5)); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ga(1); const cols = [C.blue, C.green, C.violet, C.amber]; for (let i = 0; i < 4; i++) mochi(960 + (i - 1.5) * 130, 400, 96, cols[i], t, i);
  txt('Agent Center', 960, 560, 128, C.text, 800);
  const p2 = seg(t, 58.0, 58.4); ga(p2); txt('描述目標 · 授權代理 · 驗收成果', 960, 680 + (1 - easeOut(p2)) * 24, 44, C.dim, 500);
  const p3 = seg(t, 58.6, 58.9); ga(p3); txt('在桌面上編排你的 AI 夢幻團隊', 960, 750 + (1 - easeOut(p3)) * 20, 28, C.blue, 600, 'center', F, 'middle', .06);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = seg(t, 59.3, 60); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}

const SCENES = [s0, s1, s2, s3, s4, s5, s6, s7, s8];
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  bg(t, t > 55.3 && t < 57 ? 1 + seg(t, 55.3, 56.6) * 1.2 : 1);
  for (const s of SCENES) { ctx.save(); SA = 1; s(t); ctx.restore(); }
  ctx.save(); s9(t); ctx.restore();
  subs(t);
}
window.draw = draw;

// Opened in a browser: play, or show one instant with ?t=12.3
const q = new URLSearchParams(location.search);
if (q.has('t')) { const tt = Number(q.get('t')); const go = () => (window.ready ? draw(tt) : setTimeout(go, 50)); go(); }
else if (!q.has('render')) { const start = performance.now(); const loop = () => { const t = ((performance.now() - start) / 1000) % 60; draw(t); requestAnimationFrame(loop); }; const go = () => (window.ready ? loop() : setTimeout(go, 50)); go(); }
